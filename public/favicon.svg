<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pig Legends">
  <defs>
    <radialGradient id="v" cx="38%" cy="22%" r="88%">
      <stop offset="0" stop-color="#2c3526"/>
      <stop offset="1" stop-color="#080a08"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#v)"/>

  <!-- crossed blades -->
  <g stroke="#9aa39a" stroke-width="2.6" stroke-linecap="round">
    <path d="M13 47 45 15"/>
    <path d="M51 47 19 15"/>
  </g>
  <g stroke="#b8912f" stroke-width="2" stroke-linecap="round">
    <path d="M38 12 44 18"/>
    <path d="M26 12 20 18"/>
  </g>

  <!-- heater shield -->
  <path d="M32 6 54 12v20c0 11-9 19-22 23C19 51 10 43 10 32V12Z"
        fill="#10150f" stroke="#b8912f" stroke-width="1.5"/>

  <!-- boar helm -->
  <path d="M14 30c0-9 7-15 18-15s18 6 18 15c0 8-4 14-9 17H23c-5-3-9-9-9-17Z" fill="#3a4238"/>
  <rect x="14" y="22" width="36" height="4" rx="1.6" fill="#4e564a"/>

  <!-- eyes -->
  <ellipse cx="24" cy="28" rx="3.4" ry="1.6" fill="#0c100c"/>
  <ellipse cx="40" cy="28" rx="3.4" ry="1.6" fill="#0c100c"/>
  <circle cx="24" cy="28" r="1.2" fill="#79e6a0"/>
  <circle cx="40" cy="28" r="1.2" fill="#79e6a0"/>

  <!-- snout -->
  <ellipse cx="32" cy="38" rx="7.5" ry="5.8" fill="#7a5c60"/>
  <ellipse cx="29.4" cy="38" rx="1.3" ry="2.1" fill="#0c100c"/>
  <ellipse cx="34.6" cy="38" rx="1.3" ry="2.1" fill="#0c100c"/>

  <!-- tusks -->
  <path d="M24 43c-1.6 2.4-1.6 5 0 7" stroke="#e6dcc3" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M40 43c1.6 2.4 1.6 5 0 7" stroke="#e6dcc3" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- plume -->
  <path d="M32 15c-2-3-3-6-3-9" stroke="#d8492f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M32 15c0-3 .6-6 2-9" stroke="#b8912f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
</svg>
